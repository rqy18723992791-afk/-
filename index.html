<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>智慧图书馆 - 数字化云端管理平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 移动端适配与防抖动样式 */
        body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        .tab-content { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            .mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; border-top: 1px solid #e2e8f0; z-index: 50; }
            .mobile-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 10px 0; font-size: 10px; color: #64748b; }
            .mobile-nav-item.active { color: #4f46e5; }
            .main-content { padding-bottom: 80px !important; }
            .sidebar { display: none; }
        }
        
        .book-card img { transition: transform 0.3s; }
        .book-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="bg-slate-50">

    <!-- 登录注册模块 -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center bg-indigo-600 p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-indigo-100 rounded-2xl mb-4">
                    <svg class="w-8 h-8 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <h1 class="text-2xl font-bold text-slate-800" id="auth-title">欢迎回来</h1>
                <p class="text-slate-400 mt-2" id="auth-subtitle">请输入您的账号访问图书馆</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1">手机账号</label>
                    <input type="text" id="auth-acc" value="18723992791" class="w-full p-4 bg-slate-50 rounded-xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase ml-1">访问密码</label>
                    <input type="password" id="auth-pw" value="rqy18723992791" class="w-full p-4 bg-slate-50 rounded-xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all">
                </div>
                <button onclick="handleAuth()" id="auth-btn" class="w-full py-4 bg-indigo-600 text-white font-bold rounded-xl shadow-lg shadow-indigo-100 active:scale-95 transition-all">登录系统</button>
                <div class="text-center">
                    <button onclick="toggleAuthMode()" id="auth-switch" class="text-sm text-indigo-600 font-medium">还没有账号？立即注册</button>
                </div>
            </div>
            <p id="auth-msg" class="text-center text-rose-500 text-sm mt-4"></p>
        </div>
    </div>

    <!-- 主界面模块 -->
    <div id="app-screen" class="hidden min-h-screen flex flex-col md:flex-row">
        <!-- 侧边栏 (桌面端) -->
        <aside class="sidebar w-64 bg-slate-900 text-white p-6 flex flex-col shrink-0">
            <div class="flex items-center gap-3 mb-12">
                <div class="w-8 h-8 bg-indigo-500 rounded-lg"></div>
                <span class="font-black text-xl tracking-tighter">CLOUD LIB</span>
            </div>
            <nav class="space-y-2 flex-1">
                <button onclick="switchTab('catalog')" id="nav-catalog" class="w-full text-left p-4 rounded-xl font-bold transition-all bg-indigo-600">馆藏中心</button>
                <button onclick="switchTab('admin')" id="nav-admin" class="w-full text-left p-4 rounded-xl font-bold transition-all hidden">图书管理</button>
                <button onclick="switchTab('profile')" id="nav-profile" class="w-full text-left p-4 rounded-xl font-bold transition-all">借阅历史</button>
            </nav>
            <div class="mt-auto border-t border-white/10 pt-6">
                <p id="user-name" class="font-bold">加载中...</p>
                <button onclick="logout()" class="text-xs text-rose-400 mt-2 font-bold">退出登录</button>
            </div>
        </aside>

        <!-- 内容区域 -->
        <main class="main-content flex-1 overflow-y-auto p-4 md:p-10">
            <!-- 馆藏中心 -->
            <section id="tab-catalog" class="tab-content">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                    <div>
                        <h2 class="text-3xl font-black text-slate-800">馆藏目录</h2>
                        <p class="text-slate-400 text-sm">探索您感兴趣的知识</p>
                    </div>
                    <div class="w-full md:w-72">
                        <input type="text" id="search-input" oninput="renderBooks()" placeholder="搜索书名/作者..." class="w-full p-4 bg-white rounded-2xl shadow-sm border-none focus:ring-2 ring-indigo-500/20">
                    </div>
                </div>
                <div id="book-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
                    <!-- 书籍动态加载 -->
                </div>
            </section>

            <!-- 图书管理 -->
            <section id="tab-admin" class="tab-content hidden">
                <h2 class="text-3xl font-black text-slate-800 mb-8">图书入库</h2>
                <div class="bg-white p-8 rounded-3xl shadow-sm border border-slate-100 max-w-2xl">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-4">
                            <div><label class="text-xs font-bold text-slate-400 uppercase">书名</label><input type="text" id="in-title" class="w-full p-4 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500"></div>
                            <div><label class="text-xs font-bold text-slate-400 uppercase">作者</label><input type="text" id="in-author" class="w-full p-4 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500"></div>
                            <div><label class="text-xs font-bold text-slate-400 uppercase">库存数量</label><input type="number" id="in-stock" value="1" class="w-full p-4 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500"></div>
                        </div>
                        <div class="space-y-4">
                            <label class="text-xs font-bold text-slate-400 uppercase">图书封面</label>
                            <div id="image-preview" onclick="document.getElementById('in-file').click()" class="aspect-[3/4] bg-slate-50 rounded-xl border-2 border-dashed border-slate-200 flex flex-col items-center justify-center cursor-pointer overflow-hidden relative">
                                <span class="text-slate-400 text-xs font-bold">点击选择照片</span>
                                <input type="file" id="in-file" accept="image/*" class="hidden" onchange="previewImage(this)">
                            </div>
                        </div>
                    </div>
                    <button onclick="handleUpload()" class="w-full py-4 bg-slate-900 text-white font-bold rounded-xl mt-8">发布图书到云端</button>
                </div>
            </section>

            <!-- 个人中心 (借阅历史) -->
            <section id="tab-profile" class="tab-content hidden">
                <h2 class="text-3xl font-black text-slate-800 mb-8">借阅历史</h2>
                <div id="loan-list" class="space-y-4">
                    <!-- 借阅记录动态加载 -->
                </div>
            </section>
        </main>

        <!-- 移动端导航 (Mobile Only) -->
        <nav class="mobile-nav">
            <div onclick="switchTab('catalog')" class="mobile-nav-item active" id="m-nav-catalog">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <span>馆藏</span>
            </div>
            <div onclick="switchTab('admin')" class="mobile-nav-item hidden" id="m-nav-admin">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
                <span>管理</span>
            </div>
            <div onclick="switchTab('profile')" class="mobile-nav-item" id="m-nav-profile">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                <span>我的</span>
            </div>
        </nav>
    </div>

    <!-- 弹窗组件 -->
    <div id="toast" class="fixed top-10 left-1/2 -translate-x-1/2 px-6 py-3 bg-slate-900 text-white rounded-full text-sm font-bold shadow-xl opacity-0 transition-all pointer-events-none z-[100]"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, query, onSnapshot, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. 初始化配置 (由环境提供)
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        // 2. 本地全局状态
        let currentUser = null;
        let isRegisterMode = false;
        let booksData = [];
        let uploadImageData = null;

        // 3. 核心身份验证逻辑
        window.handleAuth = async () => {
            const acc = document.getElementById('auth-acc').value;
            const pw = document.getElementById('auth-pw').value;
            if (!acc || !pw) return showToast("请填写完整信息");

            try {
                // 首先我们需要一个底层的Firebase Auth会话
                if (!auth.currentUser) {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                }

                const userDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', acc);
                const userSnap = await getDoc(userDocRef);

                if (isRegisterMode) {
                    if (userSnap.exists()) return showToast("账号已存在");
                    const newUser = { account: acc, password: pw, name: '用户' + acc.slice(-4), role: 'READER', joined: Date.now() };
                    await setDoc(userDocRef, newUser);
                    showToast("注册成功！自动登录...");
                    loginSuccess(newUser);
                } else {
                    if (!userSnap.exists() || userSnap.data().password !== pw) return showToast("账号或密码错误");
                    loginSuccess(userSnap.data());
                }
            } catch (err) {
                console.error(err);
                showToast("连接失败，请检查网络");
            }
        };

        function loginSuccess(userData) {
            currentUser = userData;
            localStorage.setItem('LOGGED_USER', JSON.stringify(userData));
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('user-name').innerText = userData.name;
            
            if (userData.role === 'ADMIN' || userData.account === '18723992791') {
                document.getElementById('nav-admin').classList.remove('hidden');
                document.getElementById('m-nav-admin').classList.remove('hidden');
            }
            initDataListeners();
        }

        window.logout = () => {
            localStorage.removeItem('LOGGED_USER');
            location.reload();
        };

        // 4. 云端数据监听 (保证多端同步)
        function initDataListeners() {
            // 监听图书
            const qBooks = collection(db, 'artifacts', appId, 'public', 'data', 'books');
            onSnapshot(qBooks, (snapshot) => {
                booksData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderBooks();
            }, (err) => console.error("Books error:", err));

            // 监听个人借阅
            const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.account);
            onSnapshot(userRef, (snapshot) => {
                if (snapshot.exists()) {
                    const data = snapshot.data();
                    renderLoans(data.loans || []);
                }
            }, (err) => console.error("User sync error:", err));
        }

        // 5. 业务功能：图书入库 (含图片)
        window.previewImage = (input) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                uploadImageData = e.target.result;
                const preview = document.getElementById('image-preview');
                preview.innerHTML = `<img src="${uploadImageData}" class="w-full h-full object-cover">`;
            };
            if (input.files[0]) reader.readAsDataURL(input.files[0]);
        };

        window.handleUpload = async () => {
            const title = document.getElementById('in-title').value;
            const author = document.getElementById('in-author').value;
            const stock = parseInt(document.getElementById('in-stock').value);

            if (!title || !uploadImageData) return showToast("请填写书名并上传照片");

            try {
                const bookId = "book_" + Date.now();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'books', bookId), {
                    title, author, stock, available: stock, image: uploadImageData, createdAt: Date.now()
                });
                showToast("云端入库成功！");
                switchTab('catalog');
                // 清空表单
                document.getElementById('in-title').value = '';
                document.getElementById('in-author').value = '';
                document.getElementById('image-preview').innerHTML = '<span class="text-slate-400 text-xs font-bold">点击选择照片</span>';
                uploadImageData = null;
            } catch (err) {
                showToast("入库失败");
            }
        };

        // 6. 业务功能：借阅逻辑
        window.borrowBook = async (bookId) => {
            const book = booksData.find(b => b.id === bookId);
            if (!book || book.available <= 0) return showToast("库存不足");

            try {
                // 1. 更新图书库存
                const bookRef = doc(db, 'artifacts', appId, 'public', 'data', 'books', bookId);
                await updateDoc(bookRef, { available: book.available - 1 });

                // 2. 更新用户借阅历史
                const userRef = doc(db, 'artifacts', appId, 'public', 'data', 'users', currentUser.account);
                await updateDoc(userRef, {
                    loans: arrayUnion({
                        bookId,
                        title: book.title,
                        date: new Date().toLocaleDateString(),
                        status: '借阅中'
                    })
                });
                showToast(`《${book.title}》借阅成功`);
            } catch (err) {
                showToast("借阅操作失败");
            }
        };

        // 7. UI 渲染逻辑
        window.renderBooks = () => {
            const grid = document.getElementById('book-grid');
            const kw = document.getElementById('search-input').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = booksData.filter(b => b.title.toLowerCase().includes(kw) || b.author.toLowerCase().includes(kw));

            filtered.forEach(book => {
                const div = document.createElement('div');
                div.className = "book-card bg-white rounded-2xl md:rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all border border-slate-100";
                div.innerHTML = `
                    <div class="aspect-[3/4] bg-slate-100 relative">
                        <img src="${book.image}" class="w-full h-full object-cover">
                        <div class="absolute top-2 right-2 px-2 py-1 bg-black/50 backdrop-blur-md text-[10px] text-white rounded-lg font-bold">
                            余 ${book.available}
                        </div>
                    </div>
                    <div class="p-3 md:p-5">
                        <h3 class="font-bold text-slate-800 text-sm md:text-base truncate">${book.title}</h3>
                        <p class="text-[10px] md:text-xs text-slate-400 mt-1">${book.author}</p>
                        <button onclick="borrowBook('${book.id}')" class="w-full mt-3 py-2 md:py-3 bg-indigo-50 text-indigo-600 text-[10px] md:text-xs font-black rounded-xl hover:bg-indigo-600 hover:text-white transition-all">
                            立即借阅
                        </button>
                    </div>
                `;
                grid.appendChild(div);
            });
        };

        window.renderLoans = (loans) => {
            const list = document.getElementById('loan-list');
            list.innerHTML = loans.length ? '' : '<div class="p-20 text-center text-slate-300 font-bold">暂无借阅记录</div>';
            
            [...loans].reverse().forEach(loan => {
                const item = document.createElement('div');
                item.className = "bg-white p-5 rounded-2xl flex items-center justify-between shadow-sm border border-slate-100";
                item.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800">${loan.title}</h4>
                        <p class="text-xs text-slate-400 mt-1">借阅日期: ${loan.date}</p>
                    </div>
                    <span class="px-3 py-1 bg-green-50 text-green-600 text-[10px] font-black rounded-full uppercase">${loan.status}</span>
                `;
                list.appendChild(item);
            });
        };

        // 8. 辅助函数
        window.switchTab = (tabId) => {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            // 更新导航高亮 (桌面)
            document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('bg-indigo-600'));
            document.getElementById('nav-' + tabId)?.classList.add('bg-indigo-600');
            
            // 更新导航高亮 (移动)
            document.querySelectorAll('.mobile-nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('m-nav-' + tabId)?.classList.add('active');
        };

        window.toggleAuthMode = () => {
            isRegisterMode = !isRegisterMode;
            document.getElementById('auth-title').innerText = isRegisterMode ? "新用户注册" : "欢迎回来";
            document.getElementById('auth-subtitle').innerText = isRegisterMode ? "创建一个云端图书馆账号" : "请输入您的账号访问图书馆";
            document.getElementById('auth-btn').innerText = isRegisterMode ? "立即注册" : "登录系统";
            document.getElementById('auth-switch').innerText = isRegisterMode ? "已有账号？去登录" : "还没有账号？立即注册";
        };

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('opacity-0', '-translate-y-5');
            setTimeout(() => t.classList.add('opacity-0', '-translate-y-5'), 2000);
        };

        // 9. 启动检查
        const cached = localStorage.getItem('LOGGED_USER');
        if (cached) {
            loginSuccess(JSON.parse(cached));
        }
    </script>
</body>
</html>
