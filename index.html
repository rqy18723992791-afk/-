<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧图书馆 - 增强兼容版</title>
    <!-- 基础依赖库 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
        .academic-bg { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
        .loading-ring { border: 4px solid #e2e8f0; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="module">
        // 尝试导入 Firebase，如果失败则走本地模式
        let firebaseApp, auth, db_fs, initialized = false;

        try {
            const fbApp = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
            const fbAuth = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");
            const fbFS = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");

            if (typeof __firebase_config !== 'undefined') {
                const config = JSON.parse(__firebase_config);
                firebaseApp = fbApp.initializeApp(config);
                auth = fbAuth.getAuth(firebaseApp);
                db_fs = fbFS.getFirestore(firebaseApp);
                
                // 暴露必要的函数给全局或 React
                window.fbTools = { ...fbAuth, ...fbFS };
                initialized = true;
            }
        } catch (e) {
            console.warn("云端模式初始化失败，切换为本地离线模式:", e);
        }

        const { useState, useEffect } = React;

        // 图标组件
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [libData, setLibData] = useState({ users: [], books: [], loans: [] });
            const [loading, setLoading] = useState(true);
            const [mode, setMode] = useState('Checking...');

            // 初始化数据
            useEffect(() => {
                const startApp = async () => {
                    if (initialized && auth) {
                        setMode('Cloud');
                        // 云端逻辑
                        try {
                            const { signInAnonymously, onAuthStateChanged } = window.fbTools;
                            await signInAnonymously(auth);
                            
                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'lib-app-v2';
                            const { doc, onSnapshot, setDoc } = window.fbTools;
                            const dataRef = doc(db_fs, 'artifacts', appId, 'public', 'data');
                            
                            onSnapshot(dataRef, (snap) => {
                                if (snap.exists()) {
                                    setLibData(snap.data());
                                } else {
                                    const init = { users: [{ id: 'ADMIN001', account: '18723992791', password: 'rqy18723992791', role: 'SUPER_ADMIN', name: '系统管理员', status: '正常' }], books: [], loans: [] };
                                    setDoc(dataRef, init);
                                    setLibData(init);
                                }
                                setLoading(false);
                            });
                        } catch (err) {
                            switchToLocal();
                        }
                    } else {
                        switchToLocal();
                    }
                };

                const switchToLocal = () => {
                    setMode('Local');
                    const local = localStorage.getItem('LIB_LOCAL_BACKUP');
                    if (local) {
                        setLibData(JSON.parse(local));
                    } else {
                        setLibData({
                            users: [{ id: 'ADMIN001', account: '18723992791', password: 'rqy18723992791', role: 'SUPER_ADMIN', name: '系统管理员', status: '正常' }],
                            books: [],
                            loans: []
                        });
                    }
                    setLoading(false);
                };

                startApp();

                const session = localStorage.getItem('LIB_SESSION');
                if (session) setUser(JSON.parse(session));
            }, []);

            const syncData = async (newData) => {
                setLibData(newData);
                localStorage.setItem('LIB_LOCAL_BACKUP', JSON.stringify(newData));
                if (initialized && mode === 'Cloud') {
                    const appId = typeof __app_id !== 'undefined' ? __app_id : 'lib-app-v2';
                    const { doc, setDoc } = window.fbTools;
                    await setDoc(doc(db_fs, 'artifacts', appId, 'public', 'data'), newData);
                }
            };

            const handleLogin = (u) => {
                setUser(u);
                localStorage.setItem('LIB_SESSION', JSON.stringify(u));
                setView('app');
            };

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-slate-50">
                    <div className="loading-ring mb-4"></div>
                    <p className="text-slate-400 font-bold text-sm">正在加载图书馆系统...</p>
                </div>
            );

            return (
                <div className="h-screen w-full">
                    {user && view === 'app' ? (
                        <Dashboard user={user} db={libData} sync={syncData} onLogout={() => { setUser(null); localStorage.removeItem('LIB_SESSION'); }} mode={mode} />
                    ) : (
                        <Auth db={libData} onLogin={handleLogin} sync={syncData} />
                    )}
                </div>
            );
        }

        // --- 登录/注册 ---
        function Auth({ db, onLogin, sync }) {
            const [isLogin, setIsLogin] = useState(true);
            const [form, setForm] = useState({ acc: '', pw: '', name: '', id: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (isLogin) {
                    const found = db.users.find(u => (u.account === form.acc || u.id === form.acc) && u.password === form.pw);
                    if (found) onLogin(found);
                    else alert('账号或密码错误');
                } else {
                    if (db.users.find(u => u.id === form.id)) return alert('学号已存在');
                    const newUser = { ...form, account: form.acc, role: 'READER', status: '正常' };
                    sync({ ...db, users: [...db.users, newUser] });
                    alert('注册成功');
                    setIsLogin(true);
                }
            };

            return (
                <div className="h-screen flex items-center justify-center academic-bg p-6">
                    <div className="bg-white p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-indigo-600 rounded-3xl mx-auto flex items-center justify-center text-white mb-4 shadow-xl shadow-indigo-100">
                                <Icon name="library" size={32} />
                            </div>
                            <h2 className="text-2xl font-black text-slate-800">智慧图书馆平台</h2>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <div className="grid grid-cols-2 gap-3">
                                    <input className="bg-slate-50 p-4 rounded-2xl outline-none text-sm w-full" placeholder="姓名" required onChange={e=>setForm({...form, name:e.target.value})} />
                                    <input className="bg-slate-50 p-4 rounded-2xl outline-none text-sm w-full" placeholder="学号" required onChange={e=>setForm({...form, id:e.target.value})} />
                                </div>
                            )}
                            <input className="bg-slate-50 p-4 rounded-2xl outline-none text-sm w-full" placeholder="账号/手机" required onChange={e=>setForm({...form, acc:e.target.value})} />
                            <input className="bg-slate-50 p-4 rounded-2xl outline-none text-sm w-full" type="password" placeholder="密码" required onChange={e=>setForm({...form, pw:e.target.value})} />
                            <button className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-bold shadow-lg shadow-indigo-100">{isLogin ? '登录' : '注册'}</button>
                        </form>
                        <button onClick={() => setIsLogin(!isLogin)} className="w-full mt-6 text-xs text-slate-400 font-bold uppercase tracking-widest">{isLogin ? '新读者注册' : '返回登录'}</button>
                    </div>
                </div>
            );
        }

        // --- 主面板 ---
        function Dashboard({ user, db, sync, onLogout, mode }) {
            const [tab, setTab] = useState(user.role.includes('ADMIN') ? 'inventory' : 'catalog');
            
            return (
                <div className="flex h-full">
                    <aside className="w-64 bg-slate-900 text-white flex flex-col p-6">
                        <div className="font-black text-xl mb-10 flex items-center gap-2">
                            <Icon name="library" className="text-indigo-500" /> 智慧系统
                        </div>
                        <div className="flex-1 space-y-2">
                            <MenuBtn active={tab === 'catalog'} onClick={()=>setTab('catalog')} icon="search" label="馆藏查询" />
                            {user.role.includes('ADMIN') && <MenuBtn active={tab === 'inventory'} onClick={()=>setTab('inventory')} icon="plus-circle" label="图书入库" />}
                            <MenuBtn active={tab === 'loans'} onClick={()=>setTab('loans')} icon="book-open" label={user.role.includes('ADMIN') ? '借阅管理' : '我的借阅'} />
                        </div>
                        <div className="bg-slate-800 p-4 rounded-2xl mt-auto">
                            <div className="text-xs font-bold mb-1">{user.name}</div>
                            <div className="text-[10px] text-slate-500 uppercase font-black mb-4">{mode} MODE</div>
                            <button onClick={onLogout} className="text-[10px] font-black text-red-400 uppercase">退出登录</button>
                        </div>
                    </aside>
                    <main className="flex-1 overflow-auto p-10">
                        {tab === 'catalog' && <Catalog db={db} user={user} sync={sync} />}
                        {tab === 'inventory' && <Inventory db={db} sync={sync} />}
                        {tab === 'loans' && <Loans db={db} user={user} sync={sync} />}
                    </main>
                </div>
            );
        }

        function MenuBtn({ active, onClick, icon, label }) {
            return (
                <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition-all ${active ? 'bg-indigo-600' : 'text-slate-400 hover:text-white hover:bg-white/5'}`}>
                    <Icon name={icon} size={18} /> {label}
                </button>
            );
        }

        // --- 模块: 入库 ---
        function Inventory({ db, sync }) {
            const [f, setF] = useState({ title: '', author: '', isbn: '', stock: 1, cover: '' });
            
            const handleAdd = () => {
                if(!f.title || !f.isbn) return alert('请填写书名和ISBN');
                const newB = { ...f, id: 'B'+Date.now(), available: parseInt(f.stock), stock: parseInt(f.stock) };
                sync({ ...db, books: [newB, ...db.books] });
                alert('入库成功');
                setF({ title: '', author: '', isbn: '', stock: 1, cover: '' });
            };

            return (
                <div className="max-w-2xl bg-white p-10 rounded-[2.5rem] shadow-sm border border-slate-100 animate-in slide-in-from-bottom-4 duration-500">
                    <h2 className="text-2xl font-black mb-8 italic">New Book Entry</h2>
                    <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <Input label="ISBN" value={f.isbn} onChange={v=>setF({...f, isbn:v})} />
                            <Input label="库存数量" type="number" value={f.stock} onChange={v=>setF({...f, stock:v})} />
                        </div>
                        <Input label="图书名称" value={f.title} onChange={v=>setF({...f, title:v})} />
                        <Input label="作者" value={f.author} onChange={v=>setF({...f, author:v})} />
                        <div className="pt-4">
                            <button onClick={handleAdd} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-100">确认入库</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 模块: 查询 ---
        function Catalog({ db, user, sync }) {
            const [q, setQ] = useState('');
            const list = db.books.filter(b => b.title.includes(q) || b.author.includes(q));

            const borrow = (book) => {
                if(book.available <= 0) return alert('无库存');
                const loan = { id: 'L'+Date.now(), bookId: book.id, title: book.title, userId: user.id, date: new Date().toLocaleDateString(), status: 'ACTIVE' };
                const books = db.books.map(b => b.id === book.id ? { ...b, available: b.available - 1 } : b);
                sync({ ...db, books, loans: [loan, ...db.loans] });
                alert('借阅成功');
            };

            return (
                <div className="space-y-6">
                    <div className="bg-white p-2 rounded-2xl shadow-sm border border-slate-100 flex items-center px-4">
                        <Icon name="search" className="text-slate-300" />
                        <input className="flex-1 p-4 outline-none font-bold text-slate-700" placeholder="快速检索书名或作者..." onChange={e=>setQ(e.target.value)} />
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {list.map(b => (
                            <div key={b.id} className="bg-white p-6 rounded-3xl border border-slate-100 flex gap-4 hover:shadow-lg transition-all">
                                <div className="w-20 h-28 bg-slate-50 rounded-xl flex items-center justify-center shrink-0">
                                    <Icon name="book" className="text-slate-200" size={32} />
                                </div>
                                <div className="flex-1 flex flex-col justify-between">
                                    <div>
                                        <div className="font-black text-slate-800">{b.title}</div>
                                        <div className="text-xs text-slate-400 font-bold">{b.author}</div>
                                    </div>
                                    <div className="flex items-center justify-between mt-4">
                                        <div className="text-[10px] font-black uppercase text-indigo-500">余量: {b.available}/{b.stock}</div>
                                        {user.role === 'READER' && <button onClick={()=>borrow(b)} className="px-4 py-1.5 bg-slate-900 text-white rounded-lg text-[10px] font-black uppercase tracking-widest">借阅</button>}
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        function Loans({ db, user, sync }) {
            const my = user.role.includes('ADMIN') ? db.loans : db.loans.filter(l => l.userId === user.id);
            return (
                <div className="bg-white rounded-3xl border border-slate-100 overflow-hidden">
                    <table className="w-full text-left">
                        <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <tr><th className="p-6">图书</th><th className="p-6">日期</th><th className="p-6">状态</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-50">
                            {my.map(l => (
                                <tr key={l.id} className="text-sm">
                                    <td className="p-6 font-bold">{l.title}</td>
                                    <td className="p-6 text-slate-400">{l.date}</td>
                                    <td className="p-6 text-green-500 font-black text-xs uppercase">{l.status}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function Input({ label, value, onChange, type="text" }) {
            return (
                <div className="space-y-1">
                    <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{label}</label>
                    <input type={type} value={value} onChange={e=>onChange(e.target.value)} className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold text-sm focus:ring-2 ring-indigo-500/20" />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
