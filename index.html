<!DOCTYPE html>
<html lang="zh-CN" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google" content="notranslate">
    <title>智慧图书馆数字化管理平台</title>
    <!-- 使用高度兼容的Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 强制防止翻译引起的UI崩溃 */
        .notranslate { translate: no !important; }
        body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
        
        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 移动端特殊样式 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100% !important;
                height: 60px !important;
                flex-direction: row !important;
                padding: 0 !important;
                z-index: 1000;
                border-top: 1px solid rgba(255,255,255,0.1);
            }
            .sidebar-header { display: none; }
            .nav-container { display: flex; width: 100%; justify-content: space-around; align-items: center; }
            .nav-item { margin-bottom: 0 !important; font-size: 12px; padding: 10px !important; flex: 1; text-align: center; }
            .content { padding: 20px 20px 80px 20px !important; }
            .user-profile { display: none !important; }
            .login-card { margin: 20px; border-radius: 16px; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden">

    <!-- 登录视图 -->
    <div id="login-screen" class="h-screen w-full flex items-center justify-center bg-gradient-to-br from-indigo-600 to-purple-700">
        <div class="login-card bg-white p-8 md:p-10 shadow-2xl w-full max-w-md text-center">
            <div class="w-16 h-16 bg-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-6">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg"></div>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">智慧图书馆</h2>
            <p class="text-slate-400 text-sm mb-8">数字化管理系统 V3.0</p>
            
            <div class="space-y-4 text-left">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider ml-1">管理账号</label>
                    <input type="text" id="login-acc" value="18723992791" class="w-full p-4 bg-slate-50 rounded-xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider ml-1">访问密码</label>
                    <input type="password" id="login-pw" value="rqy18723992791" class="w-full p-4 bg-slate-50 rounded-xl border-2 border-transparent focus:border-indigo-500 outline-none transition-all">
                </div>
            </div>
            
            <button onclick="handleLogin()" class="w-full mt-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 transition-all active:scale-95">
                进入系统
            </button>
            <p id="login-msg" class="text-red-500 text-xs mt-4 h-4"></p>
        </div>
    </div>

    <!-- 主程序视图 -->
    <div id="main-screen" class="hidden h-screen flex flex-col md:flex-row">
        <!-- 侧边栏/移动端底栏 -->
        <div class="sidebar w-64 bg-slate-900 text-white flex flex-col p-6">
            <div class="sidebar-header flex items-center gap-3 mb-10">
                <div class="w-8 h-8 bg-indigo-500 rounded-lg"></div>
                <span class="font-black tracking-tight text-xl">DIGITAL LIB</span>
            </div>
            
            <nav class="nav-container space-y-2">
                <div id="nav-catalog" onclick="switchTab('catalog')" class="nav-item p-4 rounded-xl cursor-pointer hover:bg-white/10 transition-all font-bold active bg-indigo-600">馆藏检索</div>
                <div id="admin-menu" class="hidden space-y-2">
                    <div id="nav-inventory" onclick="switchTab('inventory')" class="nav-item p-4 rounded-xl cursor-pointer hover:bg-white/10 transition-all font-bold">图书入库</div>
                </div>
                <div id="nav-loans" onclick="switchTab('loans')" class="nav-item p-4 rounded-xl cursor-pointer hover:bg-white/10 transition-all font-bold">我的借阅</div>
            </nav>

            <div class="user-profile mt-auto pt-6 border-t border-white/10">
                <div id="user-display-name" class="font-bold text-sm">加载中...</div>
                <div id="user-display-role" class="text-[10px] text-slate-500 mb-4 uppercase font-black">USER</div>
                <button onclick="handleLogout()" class="text-rose-400 text-xs font-bold hover:text-rose-300">安全退出系统</button>
            </div>
        </div>

        <!-- 内容区 -->
        <main class="content flex-1 bg-slate-50 overflow-y-auto p-6 md:p-12">
            <!-- 馆藏检索 -->
            <section id="tab-catalog" class="tab-content">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                    <h1 class="text-3xl font-black text-slate-800">全部馆藏</h1>
                    <div class="relative">
                        <input type="text" id="search-box" oninput="renderCatalog()" placeholder="搜索书名、作者..." class="w-full md:w-80 p-4 bg-white shadow-sm rounded-2xl border-none outline-none focus:ring-2 ring-indigo-500/20 font-medium">
                    </div>
                </div>
                <div id="book-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                    <!-- 书籍卡片动态插入 -->
                </div>
            </section>

            <!-- 图书入库 -->
            <section id="tab-inventory" class="tab-content hidden">
                <h1 class="text-3xl font-black text-slate-800 mb-8">新书入库</h1>
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-100 max-w-xl">
                    <div class="space-y-4">
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">书名</label><input type="text" id="add-title" class="w-full p-4 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500"></div>
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">作者</label><input type="text" id="add-author" class="w-full p-4 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500"></div>
                        <div><label class="text-[10px] font-bold text-slate-400 uppercase ml-1">初始库存</label><input type="number" id="add-stock" value="1" class="w-full p-4 bg-slate-50 rounded-xl outline-none border-2 border-transparent focus:border-indigo-500"></div>
                        <button onclick="addBook()" class="w-full py-4 bg-slate-900 text-white font-bold rounded-xl mt-4">确认入库</button>
                    </div>
                </div>
            </section>

            <!-- 我的借阅 -->
            <section id="tab-loans" class="tab-content hidden">
                <h1 class="text-3xl font-black text-slate-800 mb-8">我的借阅</h1>
                <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 text-slate-400 text-[10px] font-black uppercase tracking-widest">
                                <tr><th class="p-6">图书详情</th><th class="p-6">借阅时间</th><th class="p-6">状态</th></tr>
                            </thead>
                            <tbody id="loan-body" class="divide-y divide-slate-50">
                                <!-- 借阅记录动态插入 -->
                            </tbody>
                        </table>
                    </div>
                    <div id="no-loans" class="p-20 text-center text-slate-300 font-bold hidden">暂无借阅记录</div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 系统状态与初始数据
        let state = {
            user: null,
            books: [
                { id: 1, title: '深入理解计算机系统', author: 'R.E.B', isbn: '9787111', stock: 10, available: 8 },
                { id: 2, title: 'JavaScript 高级程序设计', author: 'Nicholas', isbn: '9787115', stock: 5, available: 5 },
                { id: 3, title: '算法导论', author: 'Cormen', isbn: '97871114', stock: 3, available: 1 }
            ],
            loans: [],
            users: [
                { account: '18723992791', password: 'rqy18723992791', name: '系统管理员', role: 'ADMIN' }
            ]
        };

        // 数据持久化
        const DB_KEY = 'LIB_V3_STORAGE';
        function save() { localStorage.setItem(DB_KEY, JSON.stringify(state)); }
        function load() {
            const data = localStorage.getItem(DB_KEY);
            if (data) state = JSON.parse(data);
            const session = localStorage.getItem('LIB_SESSION');
            if (session) {
                state.user = JSON.parse(session);
                showApp();
            }
        }

        // 登录
        function handleLogin() {
            const acc = document.getElementById('login-acc').value;
            const pw = document.getElementById('login-pw').value;
            const msg = document.getElementById('login-msg');

            const found = state.users.find(u => u.account === acc && u.password === pw);
            if (found) {
                state.user = found;
                localStorage.setItem('LIB_SESSION', JSON.stringify(found));
                showApp();
            } else {
                msg.innerText = "账号或密码错误";
            }
        }

        function handleLogout() {
            localStorage.removeItem('LIB_SESSION');
            location.reload();
        }

        // 导航切换
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('bg-indigo-600', 'active');
            });
            document.getElementById('nav-' + tabId).classList.add('bg-indigo-600', 'active');

            if (tabId === 'catalog') renderCatalog();
            if (tabId === 'loans') renderLoans();
        }

        function showApp() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('user-display-name').innerText = state.user.name;
            document.getElementById('user-display-role').innerText = state.user.role === 'ADMIN' ? 'Administrator' : 'Reader';
            
            if (state.user.role === 'ADMIN') {
                document.getElementById('admin-menu').classList.remove('hidden');
            }
            renderCatalog();
        }

        // 业务：渲染书籍卡片
        function renderCatalog() {
            const grid = document.getElementById('book-grid');
            const kw = document.getElementById('search-box').value.toLowerCase();
            grid.innerHTML = '';

            state.books.filter(b => b.title.toLowerCase().includes(kw)).forEach(book => {
                const card = document.createElement('div');
                card.className = "bg-white p-6 rounded-3xl shadow-sm border border-slate-100 hover:shadow-xl hover:shadow-indigo-500/5 transition-all group";
                card.innerHTML = `
                    <div class="h-40 bg-slate-50 rounded-2xl mb-4 flex items-center justify-center group-hover:bg-indigo-50 transition-colors">
                        <div class="w-12 h-16 bg-white shadow-sm border border-slate-100 rounded flex flex-col p-2 gap-1">
                            <div class="h-1 w-full bg-slate-100"></div>
                            <div class="h-1 w-2/3 bg-slate-100"></div>
                        </div>
                    </div>
                    <h3 class="font-bold text-slate-800 mb-1 truncate">${book.title}</h3>
                    <p class="text-xs text-slate-400 mb-4">${book.author}</p>
                    <div class="flex items-center justify-between">
                        <span class="px-3 py-1 bg-green-50 text-green-600 text-[10px] font-black rounded-full">
                            余 ${book.available}
                        </span>
                        <button onclick="borrowBook(${book.id})" class="text-xs font-bold text-indigo-600 hover:text-indigo-800">立即借阅 →</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 业务：借书
        function borrowBook(id) {
            const book = state.books.find(b => b.id === id);
            if (book.available <= 0) return alert('库存不足');
            
            book.available--;
            state.loans.unshift({
                id: Date.now(),
                title: book.title,
                date: new Date().toLocaleDateString(),
                status: '借阅中'
            });
            save();
            alert(`《${book.title}》借阅成功！`);
            renderCatalog();
        }

        // 业务：入库
        function addBook() {
            const t = document.getElementById('add-title').value;
            const a = document.getElementById('add-author').value;
            const s = parseInt(document.getElementById('add-stock').value);

            if (!t) return alert('请填写书名');
            
            state.books.unshift({ id: Date.now(), title: t, author: a, stock: s, available: s });
            save();
            alert('新书入库成功！');
            switchTab('catalog');
            document.getElementById('add-title').value = '';
        }

        // 业务：借阅记录
        function renderLoans() {
            const body = document.getElementById('loan-body');
            const empty = document.getElementById('no-loans');
            body.innerHTML = '';
            
            if (state.loans.length === 0) {
                empty.classList.remove('hidden');
            } else {
                empty.classList.add('hidden');
                state.loans.forEach(l => {
                    const tr = document.createElement('tr');
                    tr.className = "text-sm";
                    tr.innerHTML = `
                        <td class="p-6 font-bold text-slate-700">${l.title}</td>
                        <td class="p-6 text-slate-400 text-xs">${l.date}</td>
                        <td class="p-6"><span class="text-green-500 font-black text-[10px] uppercase">${l.status}</span></td>
                    `;
                    body.appendChild(tr);
                });
            }
        }

        // 初始化
        window.onload = load;
    </script>
</body>
</html>
