<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学院图书数字化管理平台 - 智慧图书馆</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .academic-bg { background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // 图标组件封装
        const Icon = ({ name, size = 18, className = "" }) => {
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [name]);
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        // 默认数据定义
        const DEFAULT_DATA = {
            users: [
                { id: 'ADMIN001', account: '18723992791', password: 'rqy18723992791', role: 'SUPER_ADMIN', name: '系统管理员', status: '正常' },
                { id: 'LIB001', account: 'librarian', password: 'password123', role: 'LIBRARIAN', name: '陈馆长', status: '正常' }
            ],
            books: [
                { id: 'B001', isbn: '9787111532644', title: '深入理解计算机系统 (原书第3版)', author: 'Randal E.Bryant', press: '机械工业出版社', year: '2016', category: 'TP3', stock: 10, available: 10, location: '主馆-计算机阅览区', callNumber: 'TP312.8/102', cover: '' }
            ],
            loans: []
        };

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login'); 
            const [db, setDb] = useState({ users: [], books: [], loans: [] });
            const [isInitializing, setIsInitializing] = useState(true);

            // 【核心修复】：初始化逻辑，严格遵循 LocalStorage 优先
            useEffect(() => {
                const loadData = () => {
                    const localUsers = localStorage.getItem('LIB_USERS_V2');
                    const localBooks = localStorage.getItem('LIB_BOOKS_V2');
                    const localLoans = localStorage.getItem('LIB_LOANS_V2');

                    let finalUsers = localUsers ? JSON.parse(localUsers) : DEFAULT_DATA.users;
                    let finalBooks = localBooks ? JSON.parse(localBooks) : DEFAULT_DATA.books;
                    let finalLoans = localLoans ? JSON.parse(localLoans) : DEFAULT_DATA.loans;

                    // 确保超级管理员始终存在且密码正确
                    const hasAdmin = finalUsers.some(u => u.id === 'ADMIN001');
                    if (!hasAdmin) {
                        finalUsers.push(DEFAULT_DATA.users[0]);
                    }

                    const currentDb = { users: finalUsers, books: finalBooks, loans: finalLoans };
                    setDb(currentDb);
                    
                    // 立即存回一次，确保版本一致
                    localStorage.setItem('LIB_USERS_V2', JSON.stringify(finalUsers));
                    localStorage.setItem('LIB_BOOKS_V2', JSON.stringify(finalBooks));
                    localStorage.setItem('LIB_LOANS_V2', JSON.stringify(finalLoans));

                    // 恢复会话
                    const session = localStorage.getItem('LIB_SESSION_V2');
                    if (session) {
                        setUser(JSON.parse(session));
                        setView('app');
                    }
                    setIsInitializing(false);
                };

                loadData();
            }, []);

            // 同步数据库到 State 和 LocalStorage
            const syncDb = (newDb) => {
                setDb(newDb);
                localStorage.setItem('LIB_USERS_V2', JSON.stringify(newDb.users));
                localStorage.setItem('LIB_BOOKS_V2', JSON.stringify(newDb.books));
                localStorage.setItem('LIB_LOANS_V2', JSON.stringify(newDb.loans));
            };

            const handleLogin = (u) => {
                setUser(u);
                localStorage.setItem('LIB_SESSION_V2', JSON.stringify(u));
                setView('app');
            };

            const handleLogout = () => {
                localStorage.removeItem('LIB_SESSION_V2');
                setUser(null);
                setView('login');
            };

            if (isInitializing) return <div className="h-screen flex items-center justify-center font-bold text-slate-500">正在接入云端文献库...</div>;

            return (
                <div className="h-screen w-full">
                    {user && view === 'app' ? (
                        <MainDashboard user={user} db={db} syncDb={syncDb} onLogout={handleLogout} />
                    ) : (
                        <AuthGateway view={view} setView={setView} db={db} onLogin={handleLogin} syncDb={syncDb} />
                    )}
                </div>
            );
        }

        // --- 认证页面 ---
        function AuthGateway({ view, setView, db, onLogin, syncDb }) {
            const [form, setForm] = useState({ acc: '', pw: '', name: '', id: '', phone: '' });
            const [error, setError] = useState('');

            const login = (e) => {
                e.preventDefault();
                const found = db.users.find(u => (u.account === form.acc || u.id === form.acc || u.phone === form.acc) && u.password === form.pw);
                if (found) onLogin(found);
                else setError('账号或密码错误');
            };

            const register = (e) => {
                e.preventDefault();
                if (db.users.find(u => u.id === form.id)) return alert('学号已注册');
                const newUser = { id: form.id, account: form.phone, phone: form.phone, password: form.pw, name: form.name, role: 'READER', status: '正常' };
                syncDb({ ...db, users: [...db.users, newUser] });
                alert('注册成功');
                setView('login');
            };

            return (
                <div className="h-screen flex items-center justify-center academic-bg p-4">
                    <div className="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md space-y-6">
                        <div className="text-center">
                            <div className="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto mb-4 flex items-center justify-center text-white shadow-lg">
                                <Icon name="library" size={32} />
                            </div>
                            <h1 className="text-2xl font-black text-slate-800">图书馆统一认证网关</h1>
                            <p className="text-sm text-slate-400 mt-1 uppercase">Unified Authentication Service</p>
                        </div>
                        <form onSubmit={view === 'login' ? login : register} className="space-y-4">
                            {view === 'register' && (
                                <div className="grid grid-cols-2 gap-4">
                                    <input className="border p-3 rounded-xl text-sm" placeholder="真实姓名" required onChange={e=>setForm({...form, name: e.target.value})} />
                                    <input className="border p-3 rounded-xl text-sm" placeholder="学号" required onChange={e=>setForm({...form, id: e.target.value})} />
                                </div>
                            )}
                            <input className="w-full border p-3 rounded-xl text-sm" placeholder="账号/手机/学号" required onChange={e=>setForm({...form, acc: e.target.value, phone: e.target.value})} />
                            <input className="w-full border p-3 rounded-xl text-sm" type="password" placeholder="密码" required onChange={e=>setForm({...form, pw: e.target.value})} />
                            {error && <div className="text-red-500 text-xs font-bold">{error}</div>}
                            <button className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-100">
                                {view === 'login' ? '登录' : '注册'}
                            </button>
                        </form>
                        <button onClick={() => setView(view === 'login' ? 'register' : 'login')} className="w-full text-sm text-indigo-600 font-bold">
                            {view === 'login' ? '还没有账号？现在注册' : '已有账号？立即登录'}
                        </button>
                    </div>
                </div>
            );
        }

        // --- 主界面 ---
        function MainDashboard({ user, db, syncDb, onLogout }) {
            const [activeTab, setActiveTab] = useState(user.role === 'READER' ? 'catalog' : 'inventory');

            const menu = user.role === 'READER' ? [
                { id: 'catalog', label: '馆藏检索', icon: 'search' },
                { id: 'mylibrary', label: '我的借阅', icon: 'book-user' }
            ] : [
                { id: 'inventory', label: '图书入库', icon: 'package-plus' },
                { id: 'catalog', label: '馆藏管理', icon: 'library' },
                { id: 'users', label: '读者管理', icon: 'users' }
            ];

            return (
                <div className="flex h-full overflow-hidden">
                    <aside className="w-64 bg-slate-900 text-white flex flex-col shadow-2xl">
                        <div className="p-8 font-black text-xl border-b border-slate-800 flex items-center gap-3">
                            <div className="bg-indigo-500 p-2 rounded-lg"><Icon name="library" size={20} /></div>
                            <span>智慧图书馆</span>
                        </div>
                        <nav className="flex-1 p-4 space-y-2">
                            {menu.map(item => (
                                <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all ${activeTab === item.id ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-900' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}>
                                    <Icon name={item.icon} size={20} />
                                    <span className="text-sm font-bold">{item.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 m-4 bg-slate-800 rounded-2xl border border-slate-700">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-10 h-10 rounded-full bg-indigo-500 flex items-center justify-center font-bold">{user.name[0]}</div>
                                <div className="truncate"><div className="text-sm font-bold">{user.name}</div><div className="text-[10px] text-slate-400 uppercase">{user.role}</div></div>
                            </div>
                            <button onClick={onLogout} className="w-full py-2 bg-slate-900 text-slate-300 hover:text-red-400 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                                <Icon name="log-out" size={14} /> 退出登录
                            </button>
                        </div>
                    </aside>
                    <main className="flex-1 overflow-auto bg-slate-50">
                        <header className="h-16 bg-white border-b px-10 flex items-center justify-between sticky top-0 z-10">
                            <h2 className="font-bold text-slate-800">{menu.find(m => m.id === activeTab)?.label}</h2>
                            <div className="text-sm text-slate-400 font-medium">{new Date().toLocaleDateString('zh-CN')}</div>
                        </header>
                        <div className="p-10">
                            {activeTab === 'inventory' && <InventoryView db={db} syncDb={syncDb} />}
                            {activeTab === 'catalog' && <CatalogView db={db} syncDb={syncDb} user={user} />}
                            {activeTab === 'mylibrary' && <MyLibraryView db={db} syncDb={syncDb} user={user} />}
                            {activeTab === 'users' && <UsersView db={db} />}
                        </div>
                    </main>
                </div>
            );
        }

        // --- 馆藏检索 (OPAC) ---
        function CatalogView({ db, syncDb, user }) {
            const [search, setSearch] = useState('');
            const filteredBooks = db.books.filter(b => b.title.includes(search) || b.author.includes(search) || b.isbn.includes(search));

            const handleBorrow = (book) => {
                if (book.available <= 0) return alert('库存不足');
                const dueDate = new Date();
                dueDate.setDate(dueDate.getDate() + 30);

                const newLoan = {
                    id: `L${Date.now()}`,
                    userId: user.id,
                    bookId: book.id,
                    title: book.title,
                    borrowDate: new Date().toISOString().split('T')[0],
                    dueDate: dueDate.toISOString().split('T')[0],
                    status: 'ACTIVE'
                };

                const updatedBooks = db.books.map(b => b.id === book.id ? { ...b, available: b.available - 1 } : b);
                syncDb({ ...db, books: updatedBooks, loans: [...db.loans, newLoan] });
                alert('借阅成功');
            };

            return (
                <div className="max-w-6xl mx-auto space-y-8 animate-in fade-in duration-500">
                    <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200">
                        <div className="relative">
                            <Icon name="search" size={20} className="absolute left-4 top-4 text-slate-400" />
                            <input className="w-full pl-12 pr-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 ring-indigo-500" placeholder="快速检索书名、作者或 ISBN..." value={search} onChange={e=>setSearch(e.target.value)} />
                        </div>
                    </div>

                    <div className="space-y-4">
                        {filteredBooks.map(book => (
                            <div key={book.id} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex gap-6 hover:shadow-md transition-all">
                                <div className="w-24 h-32 bg-slate-100 rounded-xl flex items-center justify-center flex-shrink-0 overflow-hidden border border-slate-200">
                                    {book.cover ? <img src={book.cover} className="w-full h-full object-cover" /> : <Icon name="book-open" size={32} className="text-slate-300" />}
                                </div>
                                <div className="flex-1 space-y-2">
                                    <h3 className="text-lg font-black text-slate-800">{book.title}</h3>
                                    <div className="text-sm text-slate-500 space-y-1">
                                        <p>作者: {book.author}</p>
                                        <p>索书号: <span className="text-indigo-600 font-mono font-bold">{book.callNumber || '待定'}</span></p>
                                        <p>位置: {book.location}</p>
                                    </div>
                                </div>
                                <div className="w-40 flex flex-col justify-between items-end border-l pl-6">
                                    <div className="text-right">
                                        <div className={`text-sm font-bold ${book.available > 0 ? 'text-green-600' : 'text-red-500'}`}>{book.available > 0 ? '在馆可借' : '已借完'}</div>
                                        <div className="text-[10px] text-slate-400 italic">余量: {book.available}/{book.stock}</div>
                                    </div>
                                    {user.role === 'READER' && (
                                        <button onClick={() => handleBorrow(book)} disabled={book.available <= 0} className={`w-full py-2 rounded-xl text-xs font-bold transition-all ${book.available > 0 ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-400'}`}>立即借阅</button>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- 我的图书馆 ---
        function MyLibraryView({ db, syncDb, user }) {
            const myLoans = db.loans.filter(l => l.userId === user.id && l.status === 'ACTIVE');
            
            const handleReturn = (loan) => {
                const updatedLoans = db.loans.map(l => l.id === loan.id ? { ...l, status: 'RETURNED' } : l);
                const updatedBooks = db.books.map(b => b.id === loan.bookId ? { ...b, available: b.available + 1 } : b);
                syncDb({ ...db, loans: updatedLoans, books: updatedBooks });
                alert('归还成功');
            };

            return (
                <div className="max-w-5xl mx-auto space-y-8 animate-in fade-in">
                    <div className="grid grid-cols-3 gap-6">
                        <div className="bg-indigo-600 p-6 rounded-3xl text-white shadow-xl">
                            <div className="text-xs font-bold opacity-70 uppercase">在借册数</div>
                            <div className="text-4xl font-black mt-2">{myLoans.length}</div>
                        </div>
                    </div>
                    <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden">
                        <table className="w-full text-left text-sm">
                            <thead className="bg-slate-50 border-b text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                <tr><th className="px-8 py-5">图书名称</th><th className="px-8 py-5">应还日期</th><th className="px-8 py-5 text-right">管理</th></tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                                {myLoans.map(loan => (
                                    <tr key={loan.id} className="hover:bg-slate-50">
                                        <td className="px-8 py-5 font-bold">{loan.title}</td>
                                        <td className="px-8 py-5 text-slate-500 font-mono">{loan.dueDate}</td>
                                        <td className="px-8 py-5 text-right">
                                            <button onClick={() => handleReturn(loan)} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-xl text-xs font-bold">归还</button>
                                        </td>
                                    </tr>
                                ))}
                                {myLoans.length === 0 && <tr><td colSpan="3" className="p-20 text-center text-slate-400 italic">暂无在借图书</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // --- 图书入库 ---
        function InventoryView({ db, syncDb }) {
            const [form, setForm] = useState({ isbn: '', title: '', author: '', count: 1, location: '', callNumber: '', cover: '' });
            
            const handleImage = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => setForm({ ...form, cover: reader.result });
                    reader.readAsDataURL(file);
                }
            };

            const handleAdd = () => {
                if(!form.title || !form.isbn) return alert('请填写完整');
                const newBook = { ...form, id: `B${Date.now()}`, stock: parseInt(form.count), available: parseInt(form.count) };
                syncDb({ ...db, books: [newBook, ...db.books] });
                alert('入库成功');
                setForm({ isbn: '', title: '', author: '', count: 1, location: '', callNumber: '', cover: '' });
            };

            return (
                <div className="max-w-3xl bg-white p-10 rounded-3xl shadow-sm border border-slate-200 space-y-8 animate-in slide-in-from-bottom-4">
                    <h2 className="text-2xl font-black text-slate-800 tracking-tight">新书数字化入库</h2>
                    <div className="flex gap-8">
                        <div className="w-32 h-44 bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl flex flex-col items-center justify-center overflow-hidden relative group cursor-pointer hover:border-indigo-400">
                            {form.cover ? <img src={form.cover} className="w-full h-full object-cover" /> : <div className="text-center text-slate-400"><Icon name="image-plus" className="mx-auto" /><span className="text-[10px] font-bold mt-2 block">上传封面</span></div>}
                            <input type="file" className="absolute inset-0 opacity-0 cursor-pointer" onChange={handleImage} />
                        </div>
                        <div className="flex-1 grid grid-cols-2 gap-4">
                            <Input label="ISBN" value={form.isbn} onChange={v=>setForm({...form, isbn: v})} />
                            <Input label="数量" type="number" value={form.count} onChange={v=>setForm({...form, count: v})} />
                            <div className="col-span-2"><Input label="书名" value={form.title} onChange={v=>setForm({...form, title: v})} /></div>
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                        <Input label="作者" value={form.author} onChange={v=>setForm({...form, author: v})} />
                        <Input label="索书号" value={form.callNumber} onChange={v=>setForm({...form, callNumber: v})} />
                        <div className="col-span-2"><Input label="存放架位" value={form.location} onChange={v=>setForm({...form, location: v})} /></div>
                    </div>
                    <button onClick={handleAdd} className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-all">提交并生成馆藏档案</button>
                </div>
            );
        }

        // --- 读者管理 ---
        function UsersView({ db }) {
            return (
                <div className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                    <table className="w-full text-left text-sm">
                        <thead className="bg-slate-50 border-b text-[10px] font-black text-slate-400 uppercase tracking-widest">
                            <tr><th className="px-8 py-5">姓名</th><th className="px-8 py-5">ID/学号</th><th className="px-8 py-5">角色</th><th className="px-8 py-5">状态</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {db.users.map(u => (
                                <tr key={u.id} className="hover:bg-slate-50 transition-colors">
                                    <td className="px-8 py-5 font-bold">{u.name}</td>
                                    <td className="px-8 py-5 font-mono text-xs">{u.id}</td>
                                    <td className="px-8 py-5"><span className="px-2 py-1 bg-slate-100 rounded text-[10px] font-bold">{u.role}</span></td>
                                    <td className="px-8 py-5 text-green-600 font-bold">● {u.status}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            );
        }

        function Input({ label, value, onChange, type="text" }) {
            return (
                <div className="space-y-1">
                    <label className="text-[10px] font-bold text-slate-400 uppercase">{label}</label>
                    <input type={type} value={value} onChange={e => onChange(e.target.value)} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:ring-2 ring-indigo-500 transition-all outline-none" />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
